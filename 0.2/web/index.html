<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solace 0.2</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>Solace <span>0.2</span></h1>
        <p class="tagline">Stockfish 19 compiled to WebAssembly</p>
      </header>

      <section class="board-area">
        <div class="board-wrap">
          <div id="board" class="board" aria-label="Chess board"></div>
          <div id="promotion" class="promotion" hidden>
            <span>Promote to</span>
            <div class="promotion-pieces"></div>
          </div>
        </div>
        <div class="panel">
          <div id="status" class="status">Loading engine…</div>
          <div class="progress" id="progress-wrap" hidden>
            <div class="progress-bar" id="progress"></div>
          </div>

          <label class="row">
            <span>You play</span>
            <select id="side">
              <option value="white" selected>White</option>
              <option value="black">Black</option>
            </select>
          </label>

          <label class="row">
            <span>Strength</span>
            <select id="strength">
              <option value="full" selected>Full strength</option>
              <option value="club">Club (Skill 10)</option>
              <option value="casual">Casual (Skill 5)</option>
              <option value="beginner">Beginner (Skill 0)</option>
            </select>
          </label>

          <label class="row">
            <span>Think time</span>
            <select id="movetime">
              <option value="200">0.2 s</option>
              <option value="500">0.5 s</option>
              <option value="1000" selected>1 s</option>
              <option value="2000">2 s</option>
              <option value="5000">5 s</option>
            </select>
          </label>

          <div class="buttons">
            <button id="new-game" type="button">New game</button>
            <button id="undo" type="button">Undo</button>
            <button id="flip" type="button">Flip</button>
          </div>

          <div class="eval" id="eval"></div>

          <div class="moves">
            <h2>Moves</h2>
            <ol id="move-list" class="move-list"></ol>
          </div>

          <p class="fineprint">
            Solace 0.2 is a fork of Stockfish 19 (GPLv3). Full UCI; see
            <code>0.2/README.md</code>.
          </p>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
